name: Phase 1 CI

on:
  push:
  pull_request:

jobs:
  backend-disciplines:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx import-linter ruff mypy

      - name: Ruff format check
        run: ruff format --check backend tests

      - name: Ruff lint
        run: ruff check backend tests

      - name: Mypy
        run: mypy backend/app

      - name: Import-linter contracts
        run: lint-imports --config pyproject.toml --no-cache

      - name: Pytest L1-L4
        run: python -m pytest tests -q